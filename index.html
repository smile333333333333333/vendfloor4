<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>H.E.E. Floor 4 Archives Vending Machine</title>

<style>
body{
    background:#111;
    color:#88ff88;
    font-family:Consolas,monospace;
    text-align:center;
}
#machine{
    width:720px;
    margin:30px auto;
    background:#222;
    padding:20px;
    border:4px solid #4caf50;
}
button{
    width:200px;
    margin:6px;
    padding:10px;
    background:#333;
    color:#88ff88;
    border:1px solid #88ff88;
    cursor:pointer;
    font-family:inherit;
}
button:hover{
    background:#88ff88;
    color:black;
}
#screen{
    margin-top:20px;
    background:black;
    border:2px solid #88ff88;
    padding:15px;
    min-height:180px;
    text-align:left;
    white-space:pre-wrap;
}
</style>

</head>
<body>

<div id="machine">

<h1>H.E.E. FLOOR 4 ARCHIVES VENDING UNIT</h1>

<p>AUTHORIZED ARCHIVE PERSONNEL ONLY</p>

<button onclick="show('coffee')">A1 - Groovy Coffee</button>
<button onclick="show('book')">A2 - Forbidden Bookmark</button>
<button onclick="show('peaches')">A3 - Canned Peaches</button>

<br>

<button onclick="show('battery')">B1 - Firefly Batteries</button>
<button onclick="show('soup')">B2 - Mushroom Soup</button>
<button onclick="show('oil')">B3 - Chainsaw Oil</button>

<br>

<button onclick="show('brick')">C1 - Brick Snack</button>
<button onclick="show('journal')">C2 - Archive Journal</button>
<button onclick="show('mix')">C3 - Trust No One Mix</button>

<div id="screen">

WELCOME TO FLOOR 4

Archives Division

Please return borrowed files.

Please return borrowed memories.

</div>

</div>

<script>

const items={

coffee:`GROOVY COFFEE

Extremely strong.

Recommended for employees
reading ancient books.

If the book starts talking,
close it immediately.`,

book:`FORBIDDEN BOOKMARK

Recovered from Archive C.

Do not place inside books
covered in human skin.

Management refuses to
answer further questions.`,

peaches:`CANNED PEACHES

A favorite snack of
certain cowboys.

Simple.

Reliable.

Better than prison food.`,

battery:`FIREFLY BATTERIES

Long lasting.

Perfect for exploring
dark hallways.

Look for the light.`,

soup:`CORDYCEPS-FREE
MUSHROOM SOUP

Guaranteed fungus free.

...probably.

Botany signed the label,
not Legal.`,

oil:`CHAINSAW OIL

NOT A DRINK.

Someone asked.

Now there's a warning.`,

brick:`BRICK SNACK

Looks like a brick.

Feels like a brick.

Thankfully,
doesn't taste like one.

Please stop throwing them
at the vending machine.`,

journal:`ARCHIVE JOURNAL

Most pages are blank.

Page 47 already has
someone else's handwriting.

Nobody knows whose.`,

mix:`TRUST NO ONE
TRAIL MIX

Contains peanuts.

Contains raisins.

Contains one thing
that wasn't listed.

Good luck.`

};

function show(item){
document.getElementById("screen").textContent=items[item];
}

const messages=[

"Archive Notice: Tape #12 is still missing.",

"Reminder: Return all borrowed memories.",

"Please stop asking where the chainsaw came from.",

"Someone parked a horse outside Loading Bay C.",

"Gravity Falls merchandise is not official evidence.",

"Employee #42 still owes the machine $2.00.",

"The X-Files are filed under X.",

"Today's weather: indoors.",

"Indiana from Shipping wants his hat back.",

"Ghost sightings remain unconfirmed.",

"Coffee reserves at 12%. Panic is optional.",

"Please stop feeding the archive shelves.",

"Have an acceptable shift."

];

setInterval(function(){

if(Math.random()<0.35){

document.getElementById("screen").textContent=
messages[Math.floor(Math.random()*messages.length)];

}

},7000);

</script>

</body>
</html>
